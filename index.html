<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>快递跟踪查询</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
    :root{
      color-scheme:light dark;
      --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eef2f5; --ink:#14202b; --muted:#5b6873;
      --line:#d9e0e5; --accent:#0572ce; --accent-deep:#004f91; --accent-soft:#e5f3ff;
      --success:#18794e; --success-soft:#e8f7ef; --warning:#b75a00; --shadow:0 18px 45px rgba(23,48,68,.10);
      --radius:18px;
    }
    @media (prefers-color-scheme:dark){
      :root{--bg:#0f151a;--surface:#182127;--surface-2:#202c33;--ink:#f1f5f7;--muted:#a6b3bc;--line:#314149;--accent:#56adf0;--accent-deep:#8bc9f6;--accent-soft:#17364b;--success:#63d49a;--success-soft:#19392a;--warning:#ffb56e;--shadow:0 18px 45px rgba(0,0,0,.28)}
    }
    *{box-sizing:border-box}
    html{min-width:0;background:var(--bg)}
    body{margin:0;min-width:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Noto Sans SC",sans-serif;line-height:1.5}
    button,input,select{font:inherit}
    button{color:inherit}
    .page{max-width:1120px;margin:0 auto;padding:32px 22px 56px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
    .eyebrow{margin:0 0 5px;color:var(--accent-deep);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0;letter-spacing:-.035em;user-select:none;cursor:pointer}
    .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
    body.is-admin .layout{grid-template-columns:minmax(0,1fr) 350px}
    .card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
    .tracking-card{border-radius:var(--radius);overflow:hidden}
    .searchbar{display:flex;gap:10px;padding:18px;border-bottom:1px solid var(--line)}
    .searchbox{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:0 13px;min-width:0}
    .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .searchbox svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
    .searchbox input{width:100%;min-width:0;background:transparent;color:var(--ink);border:0;outline:0;padding:13px 0;font-weight:600}
    .primary,.secondary,.icon-btn{border:0;cursor:pointer;transition:background .18s,border-color .18s}
    .primary{background:var(--accent);color:#fff;border-radius:12px;padding:0 20px;font-weight:700}
    .primary:hover{background:var(--accent-deep)}
    .shipment{padding:26px}
    .shipment-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
    .status-badge{display:inline-flex;align-items:center;gap:8px;background:var(--success-soft);color:var(--success);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}
    .status-badge i{width:8px;height:8px;background:currentColor;border-radius:50%;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 15%,transparent)}
    .shipment h2{margin:12px 0 5px;font-size:clamp(23px,3.3vw,34px);letter-spacing:-.03em}
    .route{margin:0;color:var(--muted);font-weight:500}
    .eta{text-align:right;background:var(--surface-2);padding:13px 15px;border-radius:14px;min-width:150px}
    .eta small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}.eta strong{display:block;font-size:18px}
    .progress-wrap{margin:30px 0 8px}
    .progress-line{height:6px;background:var(--surface-2);border-radius:10px;overflow:hidden}
    .progress-line span{display:block;width:58%;height:100%;background:var(--accent);border-radius:inherit}
    .progress-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}
    .recipient-box{margin-top:22px;padding:16px 18px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
    .recipient-icon{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:0 0 auto}
    .recipient-icon svg{width:18px;height:18px}
    .recipient-info{flex:1;min-width:0;font-size:13px}
    .recipient-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
    .recipient-head strong{font-size:15px;color:var(--ink)}
    .recipient-head span{color:var(--muted);font-weight:600}
    .recipient-addr{color:var(--muted);margin:0;line-height:1.4;word-break:break-all}
    .latest{margin-top:14px;padding:18px;background:var(--accent-soft);border-radius:14px;display:flex;gap:14px;align-items:flex-start}
    .latest-icon{width:38px;height:38px;display:grid;place-items:center;background:var(--accent);color:#fff;border-radius:50%;flex:0 0 auto}
    .latest small{display:block;color:var(--accent-deep);font-weight:700;margin-bottom:3px}
    .latest strong{display:block;font-size:16px}
    .latest p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .timeline-section{padding:0 26px 28px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding-top:23px;border-top:1px solid var(--line)}
    .section-title h3{margin:0;font-size:18px}.section-title span{color:var(--muted);font-size:12px}
    .timeline{list-style:none;margin:0;padding:0}
    .event{display:grid;grid-template-columns:91px 28px minmax(0,1fr);gap:12px;position:relative;min-height:86px}
    .event:not(:last-child)::after{content:"";position:absolute;left:116px;top:30px;bottom:-1px;width:2px;background:var(--line)}
    .event time{text-align:right;color:var(--muted);font-size:12px;padding-top:2px}
    .event time b{display:block;color:var(--ink);font-size:13px}
    .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line);margin:3px auto 0;z-index:1}
    .event.current .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
    .event-body{padding-bottom:22px}.event-body strong{display:block;font-size:14px}.event-body p{margin:3px 0;color:var(--muted);font-size:13px}
    .side-panel{display:none;flex-direction:column;gap:16px}
    body.is-admin .side-panel{display:flex}
    .editor{border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
    .editor-head{padding:19px 20px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .editor-head h2{font-size:18px;margin:0}
    .logout-btn{background:none;border:0;color:var(--warning);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px}
    .form{padding:17px 20px 20px;display:grid;gap:13px}
    label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
    .field{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 11px;outline:0}
    .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .inline-field{display:flex;gap:8px}
    .gen-btn{flex-shrink:0;padding:0 12px;font-size:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .range-row{display:flex;align-items:center;gap:10px}.range-row input{accent-color:var(--accent);width:100%}.range-row output{min-width:36px;color:var(--ink);font-weight:700;font-size:12px}
    .editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:3px}
    .editor-actions .primary{padding:11px 12px}
    .secondary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
    .secondary:hover{background:var(--surface-2)}
    .full-btn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:7px}
    .share-btn{background:#e9f6ed;color:#18794e;border:1px solid #c2e5cc}
    .qr-btn{background:#eef6ff;color:#0572ce;border:1px solid #bfdcff}
    .event-tools{display:none;gap:6px;margin-top:8px}
    body.is-admin .event-tools{display:flex}
    .event-tools button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:30;font-size:13px;box-shadow:var(--shadow);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;background:rgba(5,13,20,.58);display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.modal-panel{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:21px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:17px}.modal-head h2{margin:0;font-size:19px}.icon-btn{width:34px;height:34px;display:grid;place-items:center;background:var(--surface-2);border-radius:50%;font-size:22px}.modal .form{padding:0}.modal .primary{padding:11px 14px}
    .qr-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0}
    #qrcode{padding:16px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:14px;min-height:232px;min-width:232px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
    #qrcode img,#qrcode canvas{display:block;margin:0 auto}
    .qr-tip{font-size:13px;color:var(--muted);text-align:center;margin:0 0 14px}
    .short-link-input{width:100%;font-size:13px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);text-align:center;margin-bottom:10px}
    .qr-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:10px}
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div>
        <p class="eyebrow">Logistics tracking</p>
        <h1 id="pageTitle" title="点击3次打开管理后台">包裹实时追踪</h1>
      </div>
    </header>

    <div class="layout" id="mainLayout">
      <section class="card tracking-card" aria-label="包裹追踪信息">
        <div class="searchbar">
          <div class="searchbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="trackSearch" value="KD824731095" placeholder="输入快递单号查询..." />
          </div>
          <button class="primary" id="trackBtn">查询</button>
        </div>

        <div class="shipment">
          <div class="shipment-head">
            <div>
              <div class="status-badge"><i></i><span id="statusText">运输中</span></div>
              <h2 id="headline">正在前往下一站</h2>
              <p class="route"><span id="originText">广东省广州市</span> → <span id="destinationText">北京市朝阳区</span></p>
            </div>
            <div class="eta"><small>预计送达</small><strong id="etaText">10 月 16 日</strong></div>
          </div>
          <div class="progress-wrap">
            <div class="progress-line"><span id="progressBar"></span></div>
            <div class="progress-labels"><span>已揽收</span><span>运输中</span><span>派送中</span><span>已送达</span></div>
          </div>

          <div class="recipient-box">
            <div class="recipient-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="recipient-info">
              <div class="recipient-head">
                <strong id="recipientNameText">张先生</strong>
                <span id="recipientPhoneText">138****5678</span>
              </div>
              <p class="recipient-addr" id="recipientAddressText">北京市朝阳区建国路88号现代城A座1201室</p>
            </div>
          </div>

          <div class="latest">
            <div class="latest-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
            <div>
              <small>最新动态</small>
              <strong id="latestTitle">已离开转运中心</strong>
              <p><span id="latestLocation">武汉分拨中心</span> · <span id="latestTime">今天 08:42</span></p>
            </div>
          </div>
        </div>
        <div class="timeline-section">
          <div class="section-title"><h3>物流进度</h3><span id="eventCount">4 条记录</span></div>
          <ol class="timeline" id="timeline"></ol>
        </div>
      </section>

      <div class="side-panel">
        <aside class="card editor" id="editorCard">
          <div class="editor-head">
            <h2>运单修改管理</h2>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
          </div>
          <div class="form">
            <label>
              切换已有运单记录
              <select class="field" id="savedPackagesSelect">
                <option value="">-- 选择已保存的单号快速编辑 --</option>
              </select>
            </label>
            <label>
              快递单号
              <div class="inline-field">
                <input class="field" id="adminTrackingInput" value="KD824731095" />
                <button type="button" class="gen-btn" id="generateNoBtn">随机生成</button>
              </div>
            </label>
            <label>当前状态
              <select class="field" id="statusInput">
                <option>已揽收</option>
                <option>运输中</option>
                <option>派送中</option>
                <option>已送达</option>
                <option>异常延误</option>
              </select>
            </label>
            <label>状态说明标题<input class="field" id="headlineInput" value="正在前往下一站" /></label>
            <div class="two"><label>始发地<input class="field" id="originInput" value="广东省广州市" /></label><label>目的地<input class="field" id="destinationInput" value="北京市朝阳区" /></label></div>
            <div class="two">
              <label>收件人姓名<input class="field" id="recipientNameInput" value="张先生" placeholder="例如：李先生" /></label>
              <label>联系电话(输入完整手机号)<input class="field" id="recipientPhoneInput" value="13812345678" placeholder="例如：13812345678" /></label>
            </div>
            <label>收件详细地址<input class="field" id="recipientAddressInput" value="北京市朝阳区建国路88号现代城A座1201室" placeholder="详细地址" /></label>
            <label>预计送达<input class="field" id="etaInput" value="10 月 16 日" /></label>
            <label>运输进度<div class="range-row"><input id="progressInput" type="range" min="0" max="100" value="58" /><output id="progressOutput">58%</output></div></label>
            
            <div class="editor-actions">
              <button class="primary" id="applyBtn">保存并生成专属二维码</button>
              <button class="secondary" id="resetBtn">新建空白单</button>
              <button class="secondary full-btn" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>新增物流动态节点</button>
              <button class="secondary full-btn qr-btn" id="qrBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>微信扫码查件 / 保存二维码</button>
              <button class="secondary full-btn share-btn" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>一键复制查询链接</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div class="modal" id="loginModal" role="dialog" aria-modal="true">
    <div class="modal-panel" style="max-width:340px">
      <div class="modal-head">
        <h2 style="font-size:16px">管理员身份认证</h2>
        <button class="icon-btn" id="closeLoginModal">×</button>
      </div>
      <div class="form">
        <input type="password" class="field" id="adminPwdInput" placeholder="请输入管理员密码..." />
        <button class="primary" id="loginSubmitBtn">登 录</button>
      </div>
    </div>
  </div>

  <div class="modal" id="qrModal" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-head">
        <h2>微信扫码直接查件</h2>
        <button class="icon-btn" id="closeQrModal">×</button>
      </div>
      <div class="qr-box">
        <div id="qrcode"></div>
        <p class="qr-tip" id="qrTipText">此二维码包含最新运单数据，微信扫码秒开</p>
        <input type="text" id="shortLinkDisplay" class="short-link-input" readonly value="正在生成..." />
        <div class="qr-actions">
          <button class="secondary" id="copyShortLinkBtn">复制链接</button>
          <button class="primary" id="downloadQrBtn">保存二维码图片</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="eventModal" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-head"><h2 id="modalTitle">编辑物流节点</h2><button class="icon-btn" id="closeModal">×</button></div>
      <div class="form">
        <label>节点状态<input class="field" id="eventTitleInput" placeholder="例如：已离开转运中心" /></label>
        <label>地点<input class="field" id="eventLocationInput" placeholder="例如：北京市顺义区转运中心" /></label>
        <div class="two"><label>日期<input class="field" id="eventDateInput" placeholder="10 月 14 日" /></label><label>时间<input class="field" id="eventTimeInput" placeholder="14:30" /></label></div>
        <button class="primary" id="saveEventBtn">保存节点</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function(){
      var ADMIN_PASSWORD = "Aa112212.";

      var defaultData = {
        n: 'KD824731095',
        s: '运输中',
        h: '正在前往下一站',
        o: '广东省广州市',
        d: '北京市朝阳区',
        t: '10 月 16 日',
        p: '58',
        rn: '张先生',
        rp: '13812345678',
        ra: '北京市朝阳区建国路88号现代城A座1201室',
        e: [
          {d:'今天',t:'08:42',h:'已离开转运中心',l:'武汉分拨中心'},
          {d:'10 月 13 日',t:'19:26',h:'到达转运中心',l:'武汉分拨中心'},
          {d:'10 月 12 日',t:'06:15',h:'包裹已离开始发仓',l:'广州市白云分拨中心'},
          {d:'10 月 11 日',t:'17:40',h:'承运商已揽收包裹',l:'广州市天河区营业点'}
        ]
      };

      var currentData = JSON.parse(JSON.stringify(defaultData));
      var isUnlocked = false;
      var editIndex = -1;

      var $ = function(id){ return document.getElementById(id); };
      function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

      function maskPhone(phone){
        if(!phone) return '—';
        var str = String(phone).trim();
        if(/^1[3-9]\d{9}$/.test(str)){
          return str.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
        }
        if(str.indexOf('*') > -1) return str;
        if(str.length >= 7){
          return str.substring(0, 3) + '****' + str.substring(str.length - 4);
        }
        return str;
      }

      function toast(msg){
        $('toast').textContent = msg;
        $('toast').classList.add('show');
        clearTimeout(toast.t);
        toast.t = setTimeout(function(){ $('toast').classList.remove('show'); }, 2500);
      }

      function loadPackageFromStorage(trackingNo, callback){
        var cleanNo = trackingNo.replace(/\s+/g,'').toUpperCase();
        try {
          var localVal = localStorage.getItem('pkg_data_' + cleanNo);
          if(localVal){
            callback(JSON.parse(localVal));
            return;
          }
        } catch(e){}
        callback(null);
      }

      function savePackageToStorage(dataObj, callback){
        var cleanNo = dataObj.n.replace(/\s+/g,'').toUpperCase();
        try {
          localStorage.setItem('pkg_data_' + cleanNo, JSON.stringify(dataObj));
          saveToIndex(cleanNo);
          if(callback) callback(true);
        } catch(e){
          if(callback) callback(false);
        }
      }

      function getSavedIndex(){
        try { return JSON.parse(localStorage.getItem('pkg_index') || '[]'); } catch(e){ return []; }
      }
      function saveToIndex(no){
        var idx = getSavedIndex();
        var cleanNo = no.replace(/\s+/g,'').toUpperCase();
        if(idx.indexOf(cleanNo) === -1){
          idx.unshift(cleanNo);
          try { localStorage.setItem('pkg_index', JSON.stringify(idx)); } catch(e){}
        }
      }
      function updateSavedSelect(){
        var idx = getSavedIndex();
        var select = $('savedPackagesSelect');
        select.innerHTML = '<option value="">-- 选择已保存的单号快速编辑 --</option>';
        idx.forEach(function(item){
          var opt = document.createElement('option');
          opt.value = item;
          opt.textContent = item;
          if(item === currentData.n.replace(/\s+/g,'').toUpperCase()) opt.selected = true;
          select.appendChild(opt);
        });
      }

      $('savedPackagesSelect').addEventListener('change', function(){
        var chosenNo = this.value;
        if(!chosenNo) return;
        loadPackageFromStorage(chosenNo, function(data){
          if(data){
            currentData = data;
            render();
            toast('已切换到单号：' + chosenNo);
          } else {
            toast('未找到该单号数据');
          }
        });
      });

      function updateAdminUI(){
        if(isUnlocked){
          document.body.classList.add('is-admin');
          updateSavedSelect();
        } else {
          document.body.classList.remove('is-admin');
        }
      }

      var clickCount = 0;
      var clickTimer = null;
      $('pageTitle').addEventListener('click', function(){
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(function(){ clickCount = 0; }, 800);
        if(clickCount >= 3){
          clickCount = 0;
          $('loginModal').classList.add('open');
          setTimeout(function(){ $('adminPwdInput').focus(); }, 100);
        }
      });

      document.addEventListener('keydown', function(e){
        if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm'){
          e.preventDefault();
          $('loginModal').classList.add('open');
          setTimeout(function(){ $('adminPwdInput').focus(); }, 100);
        }
      });

      $('closeLoginModal').addEventListener('click', function(){ $('loginModal').classList.remove('open'); });

      $('loginSubmitBtn').addEventListener('click', function(){
        var val = $('adminPwdInput').value.trim();
        if(val === ADMIN_PASSWORD){
          isUnlocked = true;
          $('adminPwdInput').value = '';
          $('loginModal').classList.remove('open');
          updateAdminUI();
          toast('管理员已登录');
        } else {
          toast('密码错误');
        }
      });
      $('adminPwdInput').addEventListener('keydown', function(e){
        if(e.key === 'Enter') $('loginSubmitBtn').click();
      });

      $('logoutBtn').addEventListener('click', function(){
        isUnlocked = false;
        updateAdminUI();
        toast('已退出管理员模式');
      });

      $('generateNoBtn').addEventListener('click', function(){
        var prefix = 'KD';
        var randNum = Math.floor(100000000 + Math.random() * 900000000);
        var newNo = prefix + randNum;
        $('adminTrackingInput').value = newNo;
        toast('已生成新单号：' + newNo);
      });

      function render(){
        $('statusText').textContent = currentData.s;
        $('headline').textContent = currentData.h;
        $('originText').textContent = currentData.o;
        $('destinationText').textContent = currentData.d;
        $('etaText').textContent = currentData.t;
        $('progressBar').style.width = currentData.p + '%';
        $('progressOutput').textContent = currentData.p + '%';

        $('recipientNameText').textContent = currentData.rn || '未设置收件人';
        $('recipientPhoneText').textContent = maskPhone(currentData.rp);
        $('recipientAddressText').textContent = currentData.ra || '未设置收件地址';

        $('statusInput').value = currentData.s;
        $('headlineInput').value = currentData.h;
        $('originInput').value = currentData.o;
        $('destinationInput').value = currentData.d;
        $('recipientNameInput').value = currentData.rn || '';
        $('recipientPhoneInput').value = currentData.rp || '';
        $('recipientAddressInput').value = currentData.ra || '';
        $('etaInput').value = currentData.t;
        $('progressInput').value = currentData.p;
        $('trackSearch').value = currentData.n;
        $('adminTrackingInput').value = currentData.n;

        var events = currentData.e || [];
        $('timeline').innerHTML = events.map(function(ev, i){
          return '<li class="event ' + (i === 0 ? 'current' : '') + '">' +
            '<time><b>' + esc(ev.d) + '</b>' + esc(ev.t) + '</time>' +
            '<span class="dot"></span>' +
            '<div class="event-body">' +
              '<strong>' + esc(ev.h) + '</strong>' +
              '<p>' + esc(ev.l) + '</p>' +
              '<div class="event-tools">' +
                '<button data-edit="' + i + '">编辑</button>' +
                '<button data-up="' + i + '">上移</button>' +
                '<button data-delete="' + i + '">删除</button>' +
              '</div>' +
            '</div>' +
          '</li>';
        }).join('');

        $('eventCount').textContent = events.length + ' 条记录';
        if(events[0]){
          $('latestTitle').textContent = events[0].h;
          $('latestLocation').textContent = events[0].l;
          $('latestTime').textContent = events[0].d + ' ' + events[0].t;
        } else {
          $('latestTitle').textContent = '暂无物流动态';
          $('latestLocation').textContent = '—';
          $('latestTime').textContent = '—';
        }
      }

      // 核心保存按钮：每次点击保存，不仅存入本地，并自动通过加密网址参数刷新，确保扫码100%看到最新修改
      $('applyBtn').addEventListener('click', function(){
        applyForm();
        var cleanNo = currentData.n.replace(/\s+/g,'').toUpperCase();
        var dataJson = JSON.stringify({
          s: currentData.s, h: currentData.h, o: currentData.o, d: currentData.d,
          t: currentData.t, p: currentData.p, rn: currentData.rn, rp: currentData.rp, ra: currentData.ra, e: currentData.e
        });
        var encoded = encodeURIComponent(btoa(encodeURIComponent(dataJson)));
        window.location.href = window.location.origin + window.location.pathname + '#no=' + cleanNo + '&v=' + encoded;
      });

      function applyForm(){
        currentData.s = $('statusInput').value;
        currentData.h = $('headlineInput').value.trim() || '—';
        currentData.o = $('originInput').value.trim() || '—';
        currentData.d = $('destinationInput').value.trim() || '—';
        currentData.rn = $('recipientNameInput').value.trim() || '张先生';
        currentData.rp = $('recipientPhoneInput').value.trim() || '—';
        currentData.ra = $('recipientAddressInput').value.trim() || '—';
        currentData.t = $('etaInput').value.trim() || '—';
        currentData.p = $('progressInput').value;
        currentData.n = $('adminTrackingInput').value.trim() || 'KD' + Math.floor(100000000 + Math.random() * 900000000);

        savePackageToStorage(currentData, function(success){
          updateSavedSelect();
          render();
        });
      }

      $('progressInput').addEventListener('input', function(){
        $('progressOutput').textContent = this.value + '%';
        $('progressBar').style.width = this.value + '%';
      });

      function getSyncUrl(){
        applyForm();
        var cleanNo = currentData.n.replace(/\s+/g,'').toUpperCase();
        var dataJson = JSON.stringify({
          s: currentData.s, h: currentData.h, o: currentData.o, d: currentData.d,
          t: currentData.t, p: currentData.p, rn: currentData.rn, rp: currentData.rp, ra: currentData.ra, e: currentData.e
        });
        var encoded = encodeURIComponent(btoa(encodeURIComponent(dataJson)));
        return window.location.origin + window.location.pathname + '#no=' + cleanNo + '&v=' + encoded;
      }

      function renderStandardQRCode(targetText){
        $('qrcode').innerHTML = '';
        new QRCode($('qrcode'), {
          text: targetText,
          width: 200,
          height: 200,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.L
        });
      }

      $('qrBtn').addEventListener('click', function(){
        var syncUrl = getSyncUrl();
        var cleanNo = currentData.n.replace(/\s+/g,'').toUpperCase();
        $('qrModal').classList.add('open');
        $('shortLinkDisplay').value = syncUrl;
        $('qrTipText').textContent = '当前单号：' + cleanNo + '（微信扫码秒开，100%显示最新更新）';
        renderStandardQRCode(syncUrl);
      });

      $('closeQrModal').addEventListener('click', function(){ $('qrModal').classList.remove('open'); });
      
      $('copyShortLinkBtn').addEventListener('click', function(){
        var link = $('shortLinkDisplay').value;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(link).then(function(){ toast('查询链接已成功复制！'); });
        } else {
          prompt('请复制以下链接：', link);
        }
      });

      $('downloadQrBtn').addEventListener('click', function(){
        var qrImg = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
        if(!qrImg){ toast('二维码生成中，请稍候...'); return; }
        var imageUrl = qrImg.tagName.toLowerCase() === 'canvas' ? qrImg.toDataURL('image/png') : qrImg.src;
        var cleanNo = currentData.n.replace(/\s+/g,'').toUpperCase();
        var downloadLink = document.createElement('a');
        downloadLink.href = imageUrl;
        downloadLink.download = cleanNo + '_wx.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        toast('微信标准二维码下载成功！');
      });

      $('shareBtn').addEventListener('click', function(){
        var syncUrl = getSyncUrl();
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(syncUrl).then(function(){
            toast('查询链接已复制！');
          }).catch(function(){ prompt('请复制以下链接：', syncUrl); });
        } else {
          prompt('请复制以下链接：', syncUrl);
        }
      });

      function searchTracking(){
        var no = $('trackSearch').value.trim();
        if(!no){ toast('请输入有效单号'); return; }
        var cleanKey = no.replace(/\s+/g,'').toUpperCase();
        
        loadPackageFromStorage(cleanKey, function(data){
          if(data){
            currentData = data;
            render();
            toast('已查到单号【' + cleanKey + '】的物流信息！');
          } else {
            toast('未查到单号【' + no + '】的记录');
          }
        });
      }

      $('trackBtn').addEventListener('click', searchTracking);
      $('trackSearch').addEventListener('keydown', function(e){ if(e.key === 'Enter') searchTracking(); });

      function openModal(i){
        editIndex = typeof i === 'number' ? i : -1;
        $('modalTitle').textContent = editIndex > -1 ? '编辑物流节点' : '新增物流节点';
        var ev = editIndex > -1 ? currentData.e[editIndex] : {h:'', l:'', d:'', t:''};
        $('eventTitleInput').value = ev.h;
        $('eventLocationInput').value = ev.l;
        $('eventDateInput').value = ev.d;
        $('eventTimeInput').value = ev.t;
        $('eventModal').classList.add('open');
        setTimeout(function(){ $('eventLocationInput').focus(); }, 0);
      }
      function closeModal(){ $('eventModal').classList.remove('open'); }

      $('addBtn').addEventListener('click', function(){ openModal(); });
      $('closeModal').addEventListener('click', closeModal);
      $('eventModal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

      $('saveEventBtn').addEventListener('click', function(){
        var item = {
          h: $('eventTitleInput').value.trim(),
          l: $('eventLocationInput').value.trim(),
          d: $('eventDateInput').value.trim(),
          t: $('eventTimeInput').value.trim()
        };
        if(!item.h || !item.l || !item.d || !item.t){ toast('请填写完整的节点信息'); return; }
        if(editIndex > -1) currentData.e[editIndex] = item;
        else currentData.e.unshift(item);
        render();
        closeModal();
        applyForm();
      });

      $('timeline').addEventListener('click', function(e){
        if(!isUnlocked) return;
        var b = e.target.closest('button');
        if(!b) return;
        if(b.dataset.edit !== undefined) openModal(Number(b.dataset.edit));
        if(b.dataset.delete !== undefined){
          currentData.e.splice(Number(b.dataset.delete), 1);
          render();
          applyForm();
          toast('节点已删除');
        }
        if(b.dataset.up !== undefined){
          var i = Number(b.dataset.up);
          if(i > 0){
            var x = currentData.e[i-1];
            currentData.e[i-1] = currentData.e[i];
            currentData.e[i] = x;
            render();
            applyForm();
            toast('节点已上移');
          }
        }
      });

      $('resetBtn').addEventListener('click', function(){
        var randNum = Math.floor(100000000 + Math.random() * 900000000);
        currentData = JSON.parse(JSON.stringify(defaultData));
        currentData.n = 'KD' + randNum;
        currentData.h = '运单已创建，等待揽收';
        currentData.s = '已揽收';
        currentData.p = '10';
        currentData.rn = '李先生';
        currentData.rp = '13912348899';
        currentData.ra = '广东省深圳市南山区高新科技园南区T3栋';
        currentData.e = [{d:'今天', t:'刚刚', h:'运单已生成，正在等待承运商揽收', l: currentData.o}];
        render();
        toast('已新建空白单号：' + currentData.n);
      });

      document.addEventListener('keydown', function(e){ 
        if(e.key === 'Escape'){
          closeModal();
          $('qrModal').classList.remove('open');
          $('loginModal').classList.remove('open');
        }
      });

      function initFromUrl(){
        var hash = window.location.hash;
        if(hash){
          var matchV = hash.match(/v=([^&]+)/);
          if(matchV && matchV[1]){
            try {
              var decodedJson = decodeURIComponent(atob(decodeURIComponent(matchV[1])));
              var parsed = JSON.parse(decodedJson);
              if(parsed && parsed.s){
                currentData.s = parsed.s;
                currentData.h = parsed.h;
                currentData.o = parsed.o;
                currentData.d = parsed.d;
                currentData.t = parsed.t;
                currentData.p = parsed.p;
                currentData.rn = parsed.rn;
                currentData.rp = parsed.rp;
                currentData.ra = parsed.ra;
                if(parsed.e) currentData.e = parsed.e;
                var matchNo = hash.match(/no=([^&]+)/);
                if(matchNo && matchNo[1]) currentData.n = matchNo[1];
                render();
                updateAdminUI();
                return;
              }
            } catch(e){}
          }
          var matchNo = hash.match(/no=([^&]+)/);
          if(matchNo && matchNo[1]){
            loadPackageFromStorage(matchNo[1], function(data){
              if(data) currentData = data;
              render();
              updateAdminUI();
            });
            return;
          }
        }
        render();
        updateAdminUI();
      }

      initFromUrl();
    })();
  </script>
</body>
</html>
